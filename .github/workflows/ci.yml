name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARD_REF: 788616491f7489c0c873e7776de284d1cba352a5
  GOEXPERIMENT: jsonv2

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Check out Cooper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Build Ard v0.38.0 compiler
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/akonwi/ard.git "$RUNNER_TEMP/ard"
          git -C "$RUNNER_TEMP/ard" checkout --quiet "$ARD_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          (
            cd "$RUNNER_TEMP/ard/compiler"
            go build -o "$RUNNER_TEMP/bin/ard" .
          )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download Go dependencies
        run: go mod download

      - name: Test Go boundary
        run: go test ./...

      - name: Test Ard framework
        run: ard test test

      - name: Check Python scripts
        if: runner.os == 'Linux'
        run: |
          python3 -m py_compile \
            examples/test_input.py \
            examples/test_form.py \
            examples/test_scroll_form.py \
            examples/test_async.py \
            examples/test_lifecycle.py \
            examples/test_explorer.py \
            benchmarks/run.py

      - name: Test terminal examples
        if: runner.os == 'Linux'
        working-directory: examples
        env:
          ARD: ard
        run: |
          python3 test_input.py
          python3 test_form.py
          python3 test_scroll_form.py
          python3 test_async.py
          python3 test_lifecycle.py
          python3 test_explorer.py

      - name: Smoke-test benchmarks
        if: runner.os == 'Linux'
        env:
          ARD: ard
        run: python3 benchmarks/run.py --iterations 1 --warmups 0

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git show --check --oneline HEAD
          fi
