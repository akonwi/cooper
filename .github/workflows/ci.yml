name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARD_VERSION: v0.42.0

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Check out Cooper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      - name: Install Ard release
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-ard.sh "$ARD_VERSION" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download Go dependencies
        run: go mod download

      - name: Test Go boundary
        run: go test ./...

      - name: Test Ard framework
        run: ard test

      - name: Check Python scripts
        if: runner.os == 'Linux'
        run: |
          python3 -m py_compile \
            examples/test_animation.py \
            examples/test_layout_playground.py \
            examples/test_text_gallery.py \
            examples/test_dashboard.py \
            examples/test_stacking.py \
            examples/test_input_lab.py \
            examples/test_text_area.py \
            examples/test_event_inspector.py \
            examples/test_links.py \
            examples/test_terminal_focus.py \
            examples/test_widgets.py \
            examples/test_clipboard.py \
            examples/test_notification.py \
            examples/test_scroll_form.py \
            examples/test_horizontal_scroll.py \
            examples/test_select.py \
            examples/test_async.py \
            examples/test_lifecycle.py \
            examples/test_explorer.py \
            examples/test_interaction.py \
            examples/test_declarative_jobs.py \
            examples/test_cui_tinear.py \
            examples/test_cui_tinear_drag.py \
            examples/test_cui_controls.py \
            examples/test_cui_hackernews.py \
            examples/test_cui_virtual_comments.py \
            benchmarks/cui_virtual_list.py \
            benchmarks/run.py

      - name: Test terminal examples
        if: runner.os == 'Linux'
        working-directory: examples
        env:
          ARD: ard
        run: |
          python3 test_animation.py
          python3 test_layout_playground.py
          python3 test_text_gallery.py
          python3 test_dashboard.py
          python3 test_stacking.py
          python3 test_input_lab.py
          python3 test_text_area.py
          python3 test_event_inspector.py
          python3 test_links.py
          python3 test_terminal_focus.py
          python3 test_widgets.py
          python3 test_clipboard.py
          python3 test_notification.py
          python3 test_scroll_form.py
          python3 test_horizontal_scroll.py
          python3 test_select.py
          python3 test_async.py
          python3 test_lifecycle.py
          python3 test_explorer.py
          python3 test_interaction.py
          python3 test_declarative_jobs.py
          python3 test_cui_tinear.py
          python3 test_cui_tinear_drag.py
          python3 test_cui_controls.py
          ard test hackernews
          python3 test_cui_hackernews.py
          python3 test_cui_virtual_comments.py

      - name: Smoke-test benchmarks
        if: runner.os == 'Linux'
        env:
          ARD: ard
        run: |
          python3 benchmarks/run.py --iterations 1 --warmups 0
          python3 benchmarks/cui_virtual_list.py --samples 1 --warmups 0

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git show --check --oneline HEAD
          fi
